[workspace]
resolver = "2"
members = ["netd-core", "netd-abi", "libnetd", "netd-client", "dhcp4", "dhcp6", "ndp", "netd", "net"]

# netd is its own workspace root, like authd and peios-rs.
#
#   netd-core  the control wire: paths, readiness levels, request/response codec;
#            and the laws of netd's configuration, pure: the hostname, the
#            profile vocabulary, and (feature `policy`) the interface layer
#            as netd builds and judges it, for a program that checks a change
#            before making it. No I/O beyond the wire's framing.
#   dhcp4    a DHCPv4 client: packet codec and the RFC 2131 state machine as a
#            pure, clock-injected type. No sockets. Its own crate so the state
#            machine is tested without a network and could be reused.
#   dhcp6    a stateless DHCPv6 client (information-request only), same shape.
#   ndp      IPv6 neighbour discovery for a host: the RA codec and the SLAAC
#            state machine with RFC 7217 stable-privacy addresses, same shape.
#   netd     the daemon. Runs as SYSTEM with the network privileges; the only
#            member that touches netlink or the registry.
#   net      the operator command. Talks to netd over the control socket and
#            reads the registry; owns nothing.

[workspace.package]
version = "0.1.8"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace.dependencies]
libc = "0.2"
peios = { git = "https://github.com/peios/peios-rs.git", rev = "b2282f654758831e4a2e34c7b35c26e61a6ebe1c", package = "peios" }
# The interface layer is a PNP rules forest; netd builds and judges it with
# the kernel's own rules engine so the two cannot disagree about a rule.
# Exact kernel-owned inputs and licenses are recorded in vendor/kernel/ORIGIN.json.
pnp-core = { path = "vendor/kernel/peios/rust/pnp-core" }


[profile.release]
debug = 2
split-debuginfo = "off"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "none"
