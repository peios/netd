# netd — Peios's network manager and its independent operator client. One
# locked, offline Rust build emits both runtime boundaries, per-binary symbols,
# an exact shared debug-source tree, third-party notices, and corresponding
# source. Network access is confined to build.vendor.

out_dir = "out"

[source_package]
name = "dev.peios.netd-source"

[build.vendor]
command = '''
set -eu
export CARGO_HOME=/tmp/cargo-netd-vendor
mkdir -p "$CARGO_HOME" "$PEKIT_OUT"

PEIOS_RS_REV=f4309f78fbaa878a14429a5e07d778dba9ddfab7
PKM_REV=9c1d56c7ddf1d75356173815f973bf3b6329e00f
grep -F "peios-rs.git?rev=$PEIOS_RS_REV#$PEIOS_RS_REV" Cargo.lock >/dev/null
grep -F "pkm.git?rev=$PKM_REV#$PKM_REV" Cargo.lock >/dev/null
cargo vendor --locked "$PEKIT_OUT/vendor" > "$PEKIT_OUT/cargo-config.toml"
test -s "$PEKIT_OUT/cargo-config.toml"
test -n "$(find "$PEKIT_OUT/vendor" -mindepth 1 -maxdepth 1 -type d -print -quit)"
'''

[build.vendor.dependencies.peipkg]
"org.rust-lang.rust"          = ">= 1.98.1"
"org.mozilla.ca-certificates" = "*"
"org.gnu.findutils"           = "*"
"org.gnu.grep"                = "*"
"dev.peios.peiosutils"        = "*"

[build.main]
needs = ["vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true

SRC=$(pwd -P)
DEBUG_PREFIX=/usr/src/debug/dev.peios.netd-$PEKIT_VERSION
DEBUG_ROOT=$PEKIT_OUT$DEBUG_PREFIX
LICENSE_ROOT=$PEKIT_OUT/licenses
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"

for tool in cargo rustc gcc pkg-config python3 find sort cmp grep sed gzip readelf objcopy strip debugedit; do
  command -v "$tool" >/dev/null || {
    echo "netd: missing required build tool: $tool" >&2
    exit 1
  }
done

# Native releases consume the qualified packaged ABI and generated kernel
# headers. Sibling libpeios, peios-rs, and PKM checkouts are never consulted.
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
# A newer API-compatible libpeios SDK is valid; a different SONAME ABI is not.
pkg-config --atleast-version=0.5.0 peios || {
  echo "netd: dev.peios.libpeios-devel >= 0.5.0 (ABI 0) is required" >&2
  exit 1
}
readelf -dW "$(pkg-config --variable=libdir peios)/libpeios.so" |
  grep -E '\(SONAME\).*\[libpeios\.so\.0\]' >/dev/null
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"

cargo metadata --locked --offline --no-deps --format-version 1 |
  python3 -c '
import json, os, sys
metadata = json.load(sys.stdin)
members = set(metadata["workspace_members"])
versions = sorted({p["version"] for p in metadata["packages"] if p["id"] in members})
expected = os.environ["PEKIT_VERSION"]
if versions != [expected]:
    raise SystemExit(f"netd: workspace versions {versions!r} do not equal package version {expected!r}")
'

export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$PEKIT_WORKSPACE_ROOT=$DEBUG_PREFIX/.workspace --remap-path-prefix=$PEKIT_OUT_BASE=$DEBUG_PREFIX/.build --remap-path-prefix=$SRC=$DEBUG_PREFIX --remap-path-prefix=$PEKIT_VENDOR_OUT/vendor=$DEBUG_PREFIX/vendor"
# Control-flow protection (PEI-1155). Peios' libstd is built with LLVM's CET
# instrumentation (org.rust-lang.rust); stable rustc applies it to other
# crates only under -Zcf-protection, so every crate here gets ENDBR landing
# pads and the IBT/SHSTK property survives the link. The bootstrap escape
# hatch is the one the Rust recipe itself uses for the same flag.
export RUSTC_BOOTSTRAP=1
RUSTFLAGS="$RUSTFLAGS -Zcf-protection=full"

cargo build --release --locked --offline --bin netd --bin net --target-dir "$PEKIT_OUT/target-a"
cargo build --release --locked --offline --bin netd --bin net --target-dir "$PEKIT_OUT/target-b"
cmp "$PEKIT_OUT/target-a/release/netd" "$PEKIT_OUT/target-b/release/netd"
cmp "$PEKIT_OUT/target-a/release/net" "$PEKIT_OUT/target-b/release/net"

mkdir -p "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/usr/bin" \
         "$PEKIT_OUT/usr/share/regim" "$PEKIT_OUT/usr/share/regman" \
         "$PEKIT_OUT/usr/share/man/man1" "$PEKIT_OUT/usr/share/man/man8" \
         "$PEKIT_OUT/var/state/netd"
install -m 0755 "$PEKIT_OUT/target-a/release/netd" "$PEKIT_OUT/usr/sbin/netd"
install -m 0755 "$PEKIT_OUT/target-a/release/net" "$PEKIT_OUT/usr/bin/net"
install -m 0644 "$SRC/registry.d/netd-service.reg" "$PEKIT_OUT/usr/share/regim/netd-service.reg"
install -m 0644 "$SRC/registry.d/netd-default-profile.reg" "$PEKIT_OUT/usr/share/regim/netd-default-profile.reg"
install -m 0644 "$SRC/netd.regman" "$PEKIT_OUT/usr/share/regman/netd.regman"
gzip -9n < "$SRC/man/net.1" > "$PEKIT_OUT/usr/share/man/man1/net.1.gz"
gzip -9n < "$SRC/man/netd.8" > "$PEKIT_OUT/usr/share/man/man8/netd.8.gz"

python3 "$SRC/tools/collect-rust-metadata.py" --licence-root "$LICENSE_ROOT"
test -s "$LICENSE_ROOT/crate-licenses.tsv"

: > "$PEKIT_OUT/.debug-sources"
split_debug() {
  component=$1
  elf=$2
  list=$PEKIT_OUT/.debug-$component
  debugedit -b "$SRC" -d "$DEBUG_PREFIX" -l "$list" -n "$elf"
  cat "$list" >> "$PEKIT_OUT/.debug-sources"
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  test -n "$build_id"
  first=$(printf %s "$build_id" | cut -c1-2)
  rest=$(printf %s "$build_id" | cut -c3-)
  debug=$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$first/$rest.debug
  mkdir -p "$(dirname "$debug")"
  objcopy --only-keep-debug "$elf" "$debug"
  strip --strip-unneeded "$elf"
  objcopy --add-gnu-debuglink="$debug" "$elf"
  rm -f "$list"
}

split_debug netd "$PEKIT_OUT/usr/sbin/netd"
split_debug net "$PEKIT_OUT/usr/bin/net"

mkdir -p "$DEBUG_ROOT"
tr '\0' '\n' < "$PEKIT_OUT/.debug-sources" | LC_ALL=C sort -u |
while IFS= read -r source; do
  test -n "$source" || continue
  case "$source" in */) continue ;; esac
  case "$source" in
    "$DEBUG_PREFIX"/vendor/*)
      relative=${source#"$DEBUG_PREFIX"/}
      origin=$PEKIT_VENDOR_OUT/$relative
      ;;
    "$DEBUG_PREFIX"/*)
      relative=${source#"$DEBUG_PREFIX"/}
      origin=$SRC/$relative
      ;;
    vendor/*)
      relative=$source
      origin=$PEKIT_VENDOR_OUT/$source
      ;;
    *)
      relative=$source
      origin=$SRC/$source
      ;;
  esac
  test -f "$origin" || continue
  mkdir -p "$DEBUG_ROOT/$(dirname "$relative")"
  cp "$origin" "$DEBUG_ROOT/$relative"
done
rm -f "$PEKIT_OUT/.debug-sources"
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"

'''

[build.main.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"dev.peios.peiosutils"     = "*"
# The payload is staged with GNU `install -m`.
"org.gnu.coreutils-build-compat" = "*"
"org.gnu.diffutils"        = "*"
"org.gnu.findutils"        = "*"
"org.gnu.grep"             = "*"
"org.gnu.sed"              = "*"
"org.gnu.gzip"             = "*"
"org.rust-lang.rust"       = ">= 1.98.1"
"org.gnu.gcc"              = ">= 16"
"org.gnu.binutils"         = "*"
"org.sourceware.debugedit" = "*"
"org.python.python3"       = "*"
# Bindgen uses the libclang C API, supported from LLVM 22.1.8.
"org.llvm.clang-devel"     = ">= 22.1.8"
"org.pkgconf.pkgconf"      = "*"
"dev.peios.libpeios-devel" = ">= 0.5.0"

[test]
gate = true
needs = ["main", "vendor"]
command = '''
set -eu
export CARGO_HOME=$PEKIT_OUT/cargo-home
mkdir -p "$CARGO_HOME"
cp "$PEKIT_VENDOR_OUT/cargo-config.toml" "$CARGO_HOME/config.toml"
unset PEIOS_LIB_DIR PEIOS_INCLUDE PKM_UAPI
# A newer API-compatible libpeios SDK is valid; a different SONAME ABI is not.
pkg-config --atleast-version=0.5.0 peios || {
  echo "netd: dev.peios.libpeios-devel >= 0.5.0 (ABI 0) is required" >&2
  exit 1
}
readelf -dW "$(pkg-config --variable=libdir peios)/libpeios.so" |
  grep -E '\(SONAME\).*\[libpeios\.so\.0\]' >/dev/null
export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(gcc -print-file-name=include) ${BINDGEN_EXTRA_CLANG_ARGS:-}"
# The tests run with the same control-flow protection as build.main (PEI-1155).
export RUSTC_BOOTSTRAP=1
export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-Zcf-protection=full"
cargo test --release --workspace --locked --offline --target-dir "$PEKIT_OUT/tests"

# Validate the exact staged package output produced by build.main.
SRC=$(pwd -P)
PEKIT_OUT="$PEKIT_MAIN_OUT"
test "$("$PEKIT_OUT/usr/bin/net" version)" = "net $PEKIT_VERSION"
set +e
"$PEKIT_OUT/usr/bin/net" > "$PEKIT_OUT/net-usage" 2>&1
usage_status=$?
set -e
test "$usage_status" = 2
grep -F 'usage: net status' "$PEKIT_OUT/net-usage" >/dev/null
rm -f "$PEKIT_OUT/net-usage"
gzip -t "$PEKIT_OUT/usr/share/man/man1/net.1.gz"
gzip -t "$PEKIT_OUT/usr/share/man/man8/netd.8.gz"
python3 - "$PEKIT_OUT" <<'PY'
import json, pathlib, sys
root = pathlib.Path(sys.argv[1])
regim = root / "usr/share/regim"
service = json.loads((regim / "netd-service.reg").read_text())
profile = json.loads((regim / "netd-default-profile.reg").read_text())
values = {
    value["name"]: value["data"]
    for key in service["keys"]
    if key["path"] == r"Machine\System\Services\netd"
    for value in key["values"]
}
assert values["ImagePath"] == "/usr/sbin/netd"
assert values["Identity"] == "SYSTEM"
assert values["Provides"] == ["network"]
assert values["Readiness"] == 0
assert values["RuntimeDirectories"] == ["netd"]
assert values["RestartPolicy"] == 2
assert values["ErrorControl"] == 0
baseline = {
    key["path"]: {value["name"]: value["data"] for value in key.get("values", [])}
    for key in profile["keys"]
}
assert baseline[r"Machine\System\Network\Profiles\default"] == {
    "Address.Offered": 1,
    "Address.LinkLocal": 1,
    "Route.Offered": 1,
    "Dns.Offered": 1,
}
assert baseline[r"Machine\System\Network\Rules\Interface\wired"] == {
    "Interface.Kind.Equal": "wired",
    "Priority": 10,
    "Actions": ["JOIN(default)"],
}
state = root / "var/state/netd"
assert state.is_dir() and not any(state.iterdir())
regman = (root / "usr/share/regman/netd.regman").read_text()
for required in (
    r"Machine\System\Network ControlSecurity",
    r"Machine\System\Network\Rules\Interface",
    r"Machine\System\Network\Profiles",
    "RequestedAddress",
):
    assert required in regman
PY

for record in \
  "netd:$PEKIT_OUT/usr/sbin/netd" \
  "net:$PEKIT_OUT/usr/bin/net"
do
  component=${record%%:*}
  elf=${record#*:}
  readelf -h "$elf" | grep -Eq 'Type:[[:space:]]+DYN'
  readelf -lW "$elf" | grep -q 'GNU_RELRO'
  readelf -lW "$elf" | grep -Eq 'GNU_STACK[[:space:]].*RW[[:space:]]'
  if readelf -lW "$elf" | grep -E 'GNU_STACK[[:space:]].*RWE' >/dev/null; then
    echo "netd: $elf has an executable stack" >&2
    exit 1
  fi
  readelf -dW "$elf" | grep -q 'BIND_NOW'
  readelf -dW "$elf" | grep -q 'RELR'
  readelf -dW "$elf" | grep -Eq 'FLAGS_1.*PIE'
  readelf -dW "$elf" | grep -Fq 'Shared library: [libpeios.so.0]'
  readelf -dW "$elf" | grep -Fq 'Shared library: [libgcc_s.so.1]'
  readelf -dW "$elf" | grep -Fq 'Shared library: [libc.so.6]'
  if readelf -dW "$elf" | grep -E '(RPATH|RUNPATH|TEXTREL)' >/dev/null; then
    echo "netd: $elf carries a forbidden dynamic tag" >&2
    exit 1
  fi
  if readelf -SW "$elf" | grep '\.debug_info' >/dev/null; then
    echo "netd: $elf still contains unsplit debug information" >&2
    exit 1
  fi
  build_id=$(readelf -n "$elf" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
  test -n "$build_id"
  debug=$PEKIT_OUT/debug/$component/usr/lib/debug/.build-id/$(printf %s "$build_id" | cut -c1-2)/$(printf %s "$build_id" | cut -c3-).debug
  test -s "$debug"
  readelf -SW "$debug" | grep -q '\.debug_info'
  test "$(readelf -n "$debug" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)" = "$build_id"
  for forbidden in "$SRC" "$PEKIT_VENDOR_OUT" "$PEKIT_OUT_BASE" "$PEKIT_WORKSPACE_ROOT"; do
    if grep -aF "$forbidden" "$elf" "$debug" >/dev/null; then
      echo "netd: build path $forbidden leaked into $elf or its debug file" >&2
      exit 1
    fi
  done
done
'''

[test.dependencies.peipkg]
"org.git.kernel.dash"      = "*"
"dev.peios.peiosutils"     = "*"
"org.gnu.diffutils"        = "*"
"org.gnu.findutils"        = "*"
"org.gnu.grep"             = "*"
"org.gnu.sed"              = "*"
"org.gnu.gzip"             = "*"
"org.rust-lang.rust"       = ">= 1.98.1"
"org.gnu.gcc"              = ">= 16"
"org.gnu.binutils"         = "*"
"org.sourceware.debugedit" = "*"
"org.python.python3"       = "*"
# Bindgen uses the libclang C API, supported from LLVM 22.1.8.
"org.llvm.clang-devel"     = ">= 22.1.8"
"org.pkgconf.pkgconf"      = "*"
"dev.peios.libpeios-devel" = ">= 0.5.0"
