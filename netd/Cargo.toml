[package]
name = "netd"
description = "The Peios network manager: links, addresses, routes, DHCP, inventory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "netd"
path = "src/main.rs"

[dependencies]
libnetd = { path = "../libnetd" }
dhcp4 = { path = "../dhcp4" }
libc = { workspace = true }
peios = { workspace = true }
# rtnetlink marshalling. The rust-netlink family without the async runtime:
# netd drives the socket itself from its poll loop.
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-sys = "0.9"
# Interface identity: a UUID-shaped digest of bus path and MAC. Same choice
# authd made for service SIDs; pure computation.
sha1 = "0.10"
# The interface layer is a PNP rules forest; netd builds and judges it with
# the kernel's own rules engine so the two cannot disagree about a rule.
# Pin the exact rules engine revision netd was validated against. The package
# build vendors this source, so a build never consults a sibling PKM checkout.
pnp-core = { git = "https://github.com/peios/pkm.git", rev = "9c1d56c7ddf1d75356173815f973bf3b6329e00f" }
ndp = { version = "0.1.1", path = "../ndp" }
dhcp6 = { version = "0.1.1", path = "../dhcp6" }
