[package]
name = "netd"
description = "The Peios network manager: links, addresses, routes, DHCP, inventory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "netd"
path = "src/main.rs"

[dependencies]
libnetd = { path = "../libnetd", features = ["policy"] }
dhcp4 = { path = "../dhcp4" }
libc = { workspace = true }
peios = { workspace = true }
# rtnetlink marshalling. The rust-netlink family without the async runtime:
# netd drives the socket itself from its poll loop.
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-sys = "0.9"
# Interface identity: a UUID-shaped digest of bus path and MAC. Same choice
# authd made for service SIDs; pure computation.
sha1 = "0.10"
# The interface layer is a PNP rules forest, built and judged by libnetd's
# `policy`; netd makes the fact snapshot it is judged on. The revision is
# the workspace's.
pnp-core = { workspace = true }
ndp = { version = "0.1.1", path = "../ndp" }
dhcp6 = { version = "0.1.1", path = "../dhcp6" }
