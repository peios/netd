# Base metadata for the qualified production packages carved from the netd
# build tree. Revision 15 introduces the immutable Cargo graph, exact source/debug artifacts,
# deterministic builds, manuals, and fail-closed production gates.
#
#   netd  the network manager. Runs as SYSTEM; owns links, addresses,
#         routes and DHCP.
#   net   its operator command. Owns nothing; asks over a socket.
#
# Two packages because an image that manages its network some other way (or
# not at all) still wants `net status` to say so — and because a command
# every user may run should not drag a SYSTEM daemon in with it.

format = "peipkg"

[package]
version      = "{{version}}-1"
architecture = "x86_64"
license      = "MIT AND Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND ISC AND Unicode-3.0 AND Unlicense"
license_class = "free"
homepage      = "https://github.com/peios/netd"
