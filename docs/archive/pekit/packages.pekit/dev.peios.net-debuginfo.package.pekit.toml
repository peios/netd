[package]
name        = "dev.peios.net-debuginfo"
description = "Debugging symbols for the Peios network operator command"
# The same crate closure as net; checked by build.main.
license     = "((MIT OR Apache-2.0) AND Unicode-3.0) AND Apache-2.0 AND (Apache-2.0 OR MIT) AND BSD-3-Clause AND ISC AND MIT AND (MIT OR Unlicense)"

[dependencies]
"dev.peios.net" = "= {{release}}"

[files]
"@source:LICENSE"              = "usr/share/licenses/dev.peios.net-debuginfo/LICENSE"
":licenses/net/**"             ="usr/share/licenses/dev.peios.net-debuginfo/third-party"
":debug/net/usr/lib/debug/**"  = "usr/lib/debug"
